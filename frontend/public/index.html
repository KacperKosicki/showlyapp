<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Ikony i PWA -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/images/other/logo-showly.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/images/other/logo-showly.png"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Szybsze połączenie z Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonty ładowane bez blokowania pierwszego renderowania -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Poppins:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <!-- Fonty dla przeglądarek z wyłączonym JavaScriptem -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Poppins:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap"
      />
    </noscript>

    <!-- SEO -->
    <title>Showly.me – Promuj się online</title>

    <meta
      name="description"
      content="Showly.me — nowoczesne wizytówki online, rezerwacje usług i promocja Twojej działalności w internecie."
    />

    <meta
      name="keywords"
      content="wizytówki online, rezerwacje usług, profile usług, showly, promocja online, portfolio, booking, usługi online"
    />

    <meta name="author" content="Showly.me" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:title" content="Showly.me – Promuj się online" />

    <meta
      property="og:description"
      content="Nowoczesne wizytówki online, rezerwacje usług i promocja Twojej działalności w internecie."
    />

    <meta
      property="og:image"
      content="https://showly.me/images/other/logo-showly.png"
    />

    <meta property="og:url" content="https://showly.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="Showly.me" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showly.me – Promuj się online" />

    <meta
      name="twitter:description"
      content="Nowoczesne wizytówki online, rezerwacje usług i promocja Twojej działalności w internecie."
    />

    <meta
      name="twitter:image"
      content="https://showly.me/images/other/logo-showly.png"
    />
  </head>

  <body>
    <noscript>
      Do prawidłowego działania Showly.me wymagane jest włączenie JavaScriptu.
    </noscript>

    <div id="root"></div>
  </body>
</html>
